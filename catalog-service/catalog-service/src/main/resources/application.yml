server:
  port: 8083

spring:
  application:
    name: catalog-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3307/auth_db
    username: root
    password: Sujit@483
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
