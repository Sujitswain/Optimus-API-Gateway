version: '3.9'

services:
  # MySQL is running locally, so this compose file uses the local instance.
  # mysql:
  #   image: mysql:8.0
  #   container_name: optimus-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: Sujit@483
  #     MYSQL_DATABASE: optimus_db
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - optimus-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     timeout: 5s
  #     retries: 10

  # Redis runs in Docker
  redis:
    image: redis:7-alpine
    container_name: optimus-redis
    ports:
      - "6379:6379"
    networks:
      - optimus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: eureka_server
    container_name: optimus-eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    networks:
      - optimus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      timeout: 5s
      retries: 10

  # Central config server for shared application settings
  config-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: config-service
    container_name: optimus-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # API gateway that routes requests to backend services
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: optimus-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Auth service uses MySQL for users and Redis for token/session storage
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: optimus-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/optimus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: Sujit@483
      # SPRING_REDIS_HOST: redis
      # SPRING_REDIS_PORT: 6379
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Catalog service uses the shared MySQL database
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: catalog-service
    container_name: optimus-catalog
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/optimus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: Sujit@483
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Product service uses the shared MySQL database
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    container_name: optimus-product
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/optimus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: Sujit@483
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Inventory service uses the shared MySQL database
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: optimus-inventory
    ports:
      - "8085:8085"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/optimus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: Sujit@483
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Order service uses the shared MySQL database
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: optimus-order
    ports:
      - "8086:8086"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/optimus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: Sujit@483
    networks:
      - optimus-network
    depends_on:
      eureka-server:
        condition: service_healthy


networks:
  optimus-network:
    driver: bridge
